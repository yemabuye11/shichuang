name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 把构建产物发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目页（<user>.github.io/<repo>/）需要 base 路径；
      # 用户/组织页（<user>.github.io）base 为 /。自动判断，无需手填。
      - name: Compute base path
        id: base
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY##*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build -- --base "${{ steps.base.outputs.path }}"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_MOCK: "false"

      # GitHub Pages 是纯静态托管，不支持 SPA 深链刷新（如 /me）。
      # 复制一份 index.html 为 404.html，让未知路径回退到 SPA 路由。
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 自动部署 Supabase Edge Function（内容生成核心 generate）。
  # 之前这步要你本机手动跑 / 在 Dashboard 粘代码；现在 push 即自动部署。
  #
  # 前置条件（只需配一次）：在仓库 Settings → Secrets and variables → Actions 里加：
  #   - SUPABASE_ACCESS_TOKEN  ：Supabase 控制台 User Settings → Access Tokens 生成一个
  #   - SUPABASE_PROJECT_REF   ：项目 ref（就是项目 URL 里的那段，如 mmhoztwicjrxkcjfwrjk）
  # 函数运行所需的密钥（DEEPSEEK_API_KEY / SUPABASE_SERVICE_ROLE_KEY 等）仍走项目自身
  # 的 Secret Store（Dashboard → Edge Functions → 函数的 Secrets），部署只上传代码，
  # 不会覆盖你已设的密钥。
  # ---------------------------------------------------------------------------
  deploy-functions:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy generate Edge Function
        run: supabase functions deploy generate --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
